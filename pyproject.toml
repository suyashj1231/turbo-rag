[project]
name = "turbo-rag"
version = "0.1.0"
description = "From-scratch RAG with a from-scratch TurboQuant vector index"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pypdf>=4.0",                  # PDF -> text extraction (Stage 1)
    "sentence-transformers>=3.0",  # local embedding model (Stage 1)
    "google-genai>=1.0",           # Gemini: answer generation + LLM-as-judge (free tier)
    "python-dotenv>=1.0",          # loads .env so GEMINI_API_KEY is in the environment
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Stage 4+ comparisons only — do NOT import these in src/
bench = [
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2",
]

[project.scripts]
rag = "turbo_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turbo_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
